<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GenPipes agent</title>
<style>
  :root{
    --paper:#eef1f2; --panel:#ffffff; --ink:#14181b;
    --text:#1a1f24; --muted:#5c6770; --line:#dde2e4;
    --accent:#1f9e8f; --accent-press:#178172;
    --con-bg:#14181b; --con-text:#c9d4d2;
    --exec:#7fd8c8; --obs:#9ab0c0; --human:#e6c98a; --err:#e0796b; --done:#7fd8c8;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--text);font-family:var(--sans);
    display:grid;grid-template-columns:260px 1fr;height:100vh}
  @media (max-width:720px){body{grid-template-columns:1fr;height:auto}}

  aside{background:var(--panel);border-right:1px solid var(--line);
    padding:20px 16px;display:flex;flex-direction:column;gap:18px;overflow:hidden}
  .brand{font-weight:650;letter-spacing:-.01em;font-size:15px}
  .brand small{display:block;color:var(--muted);font-weight:450;font-size:12px;margin-top:2px}
  .hist-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;
    overflow-y:auto}
  .hist li{font-size:13px;line-height:1.35;padding:8px 10px;border:1px solid var(--line);
    border-radius:7px;color:var(--text);cursor:default}
  .hist .empty{border:none;color:var(--muted);padding:0}

  main{display:flex;flex-direction:column;min-width:0;padding:20px;gap:14px}
  .composer{display:flex;gap:10px;align-items:flex-end}
  textarea{flex:1;resize:none;min-height:62px;max-height:160px;padding:12px 14px;
    border:1px solid var(--line);border-radius:9px;font-family:var(--sans);font-size:14px;
    line-height:1.45;background:var(--panel);color:var(--text)}
  textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
  button{font-family:var(--sans);font-size:14px;font-weight:600;color:#fff;
    background:var(--accent);border:none;border-radius:9px;padding:0 20px;height:62px;
    cursor:pointer;white-space:nowrap}
  button:hover{background:var(--accent-press)}
  button:disabled{background:#9bb6b1;cursor:not-allowed}

  .console{flex:1;min-height:0;background:var(--con-bg);border-radius:11px;
    padding:16px 18px;overflow-y:auto;font-family:var(--mono);font-size:12.5px;
    line-height:1.55;color:var(--con-text);white-space:pre-wrap;word-break:break-word}
  .console .ph{color:#5b6a6e;font-family:var(--sans);font-size:14px}
  .ln-human{color:var(--human)}
  .ln-exec{color:var(--exec)}
  .ln-obs{color:var(--obs)}
  .ln-err{color:var(--err)}
  .ln-done{color:var(--done);font-style:italic}

  .status{font-size:12px;color:var(--muted);height:14px}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);
    margin-right:7px;vertical-align:middle;animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
</style>
</head>
<body>
  <aside>
    <div class="brand">GenPipes agent
      <small>local · runs as you · no gate yet</small>
    </div>
    <div class="hist-label">This session</div>
    <ul class="hist" id="hist"><li class="empty">No runs yet.</li></ul>
  </aside>

  <main>
    <div class="composer">
      <textarea id="task" placeholder="Describe a task, e.g. generate the dnaseq germline_snv script for the test readset, all 27 steps, don't submit."></textarea>
      <button id="run">Run</button>
    </div>
    <div class="status" id="status"></div>
    <div class="console" id="con"><span class="ph">The agent's steps stream here as it works.</span></div>
  </main>

<script>
const $ = id => document.getElementById(id);
const con = $("con"), runBtn = $("run"), taskEl = $("task"), statusEl = $("status"), histEl = $("hist");
let buffer = "", placeholderCleared = false, es = null;

function classify(line){
  const l = line.toLowerCase();
  if(l.includes("human message")) return "ln-human";
  if(l.includes("<execute")||l.includes("```bash")||l.startsWith("#!bash")) return "ln-exec";
  if(l.includes("<observation")||l.includes("<solution")) return "ln-obs";
  if(l.includes("error")||l.includes("[run failed]")||l.includes("traceback")) return "ln-err";
  return "";
}

function render(){
  // re-render the buffer as classified lines
  con.innerHTML = "";
  for(const raw of buffer.split("\n")){
    const div = document.createElement("div");
    const cls = classify(raw);
    if(cls) div.className = cls;
    div.textContent = raw;
    con.appendChild(div);
  }
  con.scrollTop = con.scrollHeight;
}

function append(chunk){
  if(!placeholderCleared){ con.innerHTML=""; placeholderCleared=true; }
  buffer += chunk;
  render();
}

async function refreshHistory(){
  try{
    const r = await fetch("/history"); const d = await r.json();
    if(!d.history.length){ histEl.innerHTML = '<li class="empty">No runs yet.</li>'; return; }
    histEl.innerHTML = "";
    d.history.slice().reverse().forEach(h=>{
      const li = document.createElement("li");
      li.textContent = h.task.length>90 ? h.task.slice(0,90)+"…" : h.task;
      histEl.appendChild(li);
    });
  }catch(e){}
}

function setBusy(b){
  runBtn.disabled = b;
  runBtn.textContent = b ? "Running" : "Run";
  statusEl.innerHTML = b ? '<span class="dot"></span>Agent working — one run at a time' : "";
}

async function start(){
  const task = taskEl.value.trim();
  if(!task) return;
  setBusy(true);
  buffer = ""; placeholderCleared = false;
  con.innerHTML = '<span class="ph">Starting…</span>';

  const r = await fetch("/run",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({task})});
  const d = await r.json();
  if(!d.ok){ con.innerHTML=""; append("[blocked] "+d.error+"\n"); setBusy(false); return; }

  es = new EventSource("/stream");
  es.onmessage = e => append(JSON.parse(e.data));
  es.addEventListener("done", ()=>{
    es.close(); es=null;
    buffer += "\n— run complete —\n"; render();
    setBusy(false); refreshHistory();
  });
  es.onerror = ()=>{ if(es){es.close();es=null;} setBusy(false); };
}

runBtn.addEventListener("click", start);
taskEl.addEventListener("keydown", e=>{
  if((e.metaKey||e.ctrlKey) && e.key==="Enter") start();
});
refreshHistory();
</script>
</body>
</html>
