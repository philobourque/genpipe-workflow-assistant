name: tests

# The suites that can run anywhere and still say something true. They import
# only the standard library -- every module in the genpipe package except
# agent.py and cli.py was deliberately kept free of biomni for exactly this
# reason, so CI needs no pinned agent stack, no API key, and no cluster.
#
# What is NOT here, and why: test_lifecycle.py, test_app.py, test_agent_gate.py
# and test_mock_pipeline.py drive the real LangGraph gate and a real terminal,
# so they need biomni==0.0.8 and its pinned langgraph. Installing that on every
# push to check a gate matcher would trade a two-second signal for a
# several-minute one. Those four run on the cluster, in the venv, before a
# release -- as do the scenarios in testcases/, which walk the product rather
# than its parts. See the README.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the version start_agent.sh loads on the cluster, so a syntax
          # or stdlib difference shows up here rather than on Rorqual.
          python-version: "3.12"

      - name: The gate's invariants
        # First, and on its own step, because it is the only test here whose
        # failure means something unsafe rather than something broken.
        run: python tests/test_gate.py

      - name: Runs and jobs
        run: python tests/test_runs.py

      - name: The fake cluster
        run: python tests/test_fakecluster.py

      - name: Every renderer
        run: python tests/test_display.py

      - name: Environment preflight
        # Grades its findings: RAP_ID blocks a submission, JOB_MAIL only warns.
        # Getting that backwards either stops work that would have succeeded or
        # trains the operator to ignore the warning that matters.
        run: python tests/test_preflight.py

      - name: What the scheduler says a run is doing
        # The suite for the bug that started all of this: log_report reported a
        # run that died at 10:12 as healthy and in progress, because it reads
        # files on disk and the filesystem structurally cannot record a job that
        # never started or one that was killed.
        run: python tests/test_resolve.py

      - name: The three gate verbs
        # Includes the one property here that is a safety property rather than
        # behaviour: prose at the gate never approves.
        run: python tests/test_modify.py

      - name: Telling a run request from a question
        run: python tests/test_prep.py

      - name: Readset files, built from structure alone
        run: python tests/test_readset.py

      - name: Discovering runs already on disk, without reading any data
        run: python tests/test_scan.py

      - name: Intake, slots, and the grammar they must agree with
        # Also the tripwire on genpipes.md's size, and the check that the ini
        # table in slots.py still matches the one in genpipes.md. They are the
        # same knowledge written twice and nothing else stops them drifting.
        run: python tests/test_intake.py

      - name: Everything imports without a cluster present
        # A stdlib-only module that quietly grows a heavy import would break CI
        # in a confusing way later; catching it as its own step names the cause.
        run: |
          python -c "from genpipe import gate, runs, fakecluster, display, preflight, slots, intake, ui, modify, prep, readset; print('ok')"
          python -c "import genpipe, sys; assert 'biomni' not in sys.modules; print('no biomni')"
