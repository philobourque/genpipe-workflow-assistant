name: tests

# TWO JOBS, split by what they have to install rather than by what they cover.
#
# `offline` is the fast one: every module in the genpipe package except agent.py
# and cli.py was deliberately kept free of biomni, so these need no pinned agent
# stack, no API key and no cluster, and they answer in seconds.
#
# `agent` installs biomni==0.0.8 and its pinned langgraph and runs the suites
# that drive the real gate. It exists because the reasoning that kept them out
# -- "installing the stack on every push to check a gate matcher trades a
# two-second signal for a several-minute one" -- was a fair trade for a gate
# MATCHER and stopped being one once the architectural protections moved into
# that half. test_capability asserts that prose containing every trigger word
# anybody could imagine produces no capability; test_surface dispatches every
# public command and proves the held run never became a submission; the
# lifecycle suites are the only automated proof that hold -> approve -> submit
# still works. Those cannot be allowed to regress between releases just because
# they are slower to run than the rest.
#
# The two jobs run in parallel and both must pass; the split is about install
# cost, not about one mattering less than the other.
#
# What is still NOT in CI: test_app.py, which drives a real pty through pyte,
# and the scenarios in testcases/. Both run on the cluster before a release.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the version start_agent.sh loads on the cluster, so a syntax
          # or stdlib difference shows up here rather than on Rorqual.
          python-version: "3.12"

      - name: The gate's invariants
        # First, and on its own step, because it is the only test here whose
        # failure means something unsafe rather than something broken.
        run: python tests/test_gate.py

      - name: Runs and jobs
        # Includes reconcile(): whether a submission actually happened. The
        # suite for the defect where 46 real jobs ran and the registry said
        # the run was still awaiting approval.
        run: python tests/test_runs.py

      - name: The fake cluster
        run: python tests/test_fakecluster.py

      - name: Every renderer
        run: python tests/test_display.py

      - name: Environment preflight
        # Grades its findings: RAP_ID blocks a submission, JOB_MAIL only warns.
        # Getting that backwards either stops work that would have succeeded or
        # trains the operator to ignore the warning that matters.
        run: python tests/test_preflight.py

      - name: What the scheduler says a run is doing
        # The suite for the bug that started all of this: log_report reported a
        # run that died at 10:12 as healthy and in progress, because it reads
        # files on disk and the filesystem structurally cannot record a job that
        # never started or one that was killed.
        run: python tests/test_resolve.py

      - name: The -c stack — identity, order, picker states, past run configs
        # The flag that is plural and whose ORDER is its semantics. Covers the
        # parse that dropped a bare relative ini from the record, the basename
        # identity that merged two different files, and reordering.
        run: python tests/test_config_stack.py

      - name: A declared change, and whether the command actually makes it
        # The boundary: the model says what it decided, deterministic code
        # checks the command against it. Nothing here reads anybody's prose.
        run: python tests/test_declared.py

      - name: Which files belong to the run being diagnosed
        # A working directory accumulates runs, and the same step re-run a week
        # later writes the same job name into the same folder. The suite for
        # the defect where a July failure was diagnosed from August's logs.
        run: python tests/test_evidence.py

      - name: Where a run's config values came from
        # Evidence, not a verdict: the -c stack from the run's own trace, what
        # each ini says now, and the fact that those two can disagree without
        # this layer saying why.
        run: python tests/test_provenance.py

      - name: The meter in front of the model
        # Cache breakpoint, provider usage, and the one narrow repair for a
        # reply that is an execution payload with no tag around it.
        run: python tests/test_metering.py

      - name: The three gate verbs
        # Includes the one property here that is a safety property rather than
        # behaviour: prose at the gate never approves.
        run: python tests/test_modify.py

      - name: Mention is not selection
        # The guard on the boundary that was moved back to the agent: matching
        # a pipeline or protocol name proves it was TYPED, not chosen, so
        # deterministic memory keeps none of it. Asserts the deleted classifier
        # and goal table stay deleted.
        run: python tests/test_prep.py

      - name: Readset files, built from structure alone
        run: python tests/test_readset.py

      - name: Discovering runs already on disk, without reading any data
        run: python tests/test_scan.py

      - name: Intake, slots, and the grammar they must agree with
        # Also the tripwire on genpipes.md's size, and the check that the ini
        # table in slots.py still matches the one in genpipes.md. They are the
        # same knowledge written twice and nothing else stops them drifting.
        run: python tests/test_intake.py

      - name: The freedoms — model's and user's
        # The two halves of the architecture, asserted as invariants because
        # both can be broken by a change that makes some individual screen
        # nicer and nothing else would go red. Prose selects no pipeline, no
        # protocol, no capability and no submission; and an option GenPipes
        # calls optional does not become mandatory here.
        run: python tests/test_freedom.py

      - name: GenPipes' own parsers, against the table that describes them
        # Compares slots.py to genpipe/genpipes_facts.json, which is generated
        # from a real install by tools/genpipes_facts.py. The table is still
        # what the product reads -- it has to work on a machine with no
        # GenPipes -- but it can no longer drift from the software silently.
        run: python tests/test_requirements.py

      - name: The palette, and whether its colours can actually be read
        # Computes a WCAG contrast ratio for every colour in both tuned
        # palettes against the backgrounds theme.py says it chose them for.
        # This is what stops the palette drifting back to "looks fine on my
        # machine": a value edited to something prettier and less legible
        # fails here rather than on somebody's laptop three weeks later.
        run: python tests/test_theme.py

      - name: The settings file, read by the app that writes it
        # The regression for a .env the app wrote and never read. Also the
        # allow-list: a plain text file loaded at startup with no supervision
        # must not be able to set PATH or PYTHONPATH.
        run: python tests/test_settings.py

      - name: The line editor's wrapping and caret arithmetic
        run: python tests/test_ui.py

      - name: The /modify panel, and a fork's own identity
        # Carries the regressions for the fork defects: the panel is drawn
        # under the name of the run being BUILT, an unchanged fork is still
        # creatable, and no extra row is emitted twice.
        run: python tests/test_panel.py

      - name: What a run's status may claim
        # Submission evidence beats everything. The suite for the run that
        # submitted 46 jobs and said `held` for three weeks.
        run: python tests/test_classify.py

      - name: Reading a generated command back
        run: python tests/test_mirror.py

      - name: Step ranges, scoped to the protocol they belong to
        # Seven dnaseq protocols whose step numbers all restart at 1. Also the
        # scoping that stops "set walltime to 24 hours" being read as step 24.
        run: python tests/test_steps.py

      - name: Everything imports without a cluster present
        # A stdlib-only module that quietly grows a heavy import would break CI
        # in a confusing way later; catching it as its own step names the cause.
        run: |
          python -c "from genpipe import gate, runs, fakecluster, display, preflight, slots, intake, ui, modify, prep, readset, theme, settings; print('ok')"
          python -c "import genpipe, sys; assert 'biomni' not in sys.modules; print('no biomni')"

  agent:
    # The suites that need the real LangGraph gate. Slower, and the only
    # automated cover for the capability boundary, the command surface and the
    # submission lifecycle.
    runs-on: ubuntu-latest

    # NO ENVIRONMENT IS INJECTED HERE, and that is deliberate.
    #
    # This job briefly set RAP_ID, because the suites that approve and submit
    # fail without one -- preflight blocks a submission with no allocation, and
    # Slurm really does reject a job carrying an empty -A. Setting it here made
    # the job green and left the actual defect in place: those suites needed an
    # allocation, never said so, and had been silently inheriting one from the
    # Alliance login shell. Anybody running them on a laptop still failed.
    #
    # So they ask for it themselves now -- harness.submission_environment(),
    # called by name from the four suites that submit -- and this job runs them
    # in whatever environment a runner happens to have, which is the point of
    # running them on a runner at all.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: The pinned agent stack
        # requirements.txt exactly, because agent.py reaches into LangGraph's
        # snapshot/interrupt internals and those are not a stable API across
        # versions. Nothing here needs an API key: every suite below drives a
        # scripted model.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Prose is never a capability call
        # The architectural boundary, and the reason this job exists. Asserts
        # that a sentence containing every trigger word anybody could imagine
        # produces no capability at all, that the table is closed, and that
        # each capability is bound to the same method its slash command calls.
        run: python tests/test_capability.py

      - name: One command table, and every command in it
        # Dispatches every public command for real against the fake cluster,
        # then checks the held run never became a submission. Also the
        # source-level proof that the fork path uses the fork-aware ini seam.
        run: python tests/test_surface.py

      - name: The gate, inside the graph
        run: python tests/test_agent_gate.py

      - name: Hold, approve, submit, check
        run: python tests/test_lifecycle.py

      - name: Re-gating after a rework
        run: python tests/test_regate.py

      - name: A rerun is verified like a /modify
        # The reported failure: "rerun it, without override_walltime.ini" came
        # back with the ini still on -c and reached `submitted`. Drives the real
        # graph, with the model's SEMANTIC decision stubbed -- what is checked
        # is that the decision cannot silently disappear between the block the
        # model wrote and the box somebody approves.
        run: GENPIPE_FAKE=1 python tests/test_rerun_gate.py

      - name: Preparation carried across turns
        run: python tests/test_run_prep.py

      - name: End to end, against a scripted model
        run: python tests/test_mock_pipeline.py

      - name: Clone, launch, paste a key, switch model
        # The path somebody walks exactly once, and therefore the one nobody
        # who built this ever walks again. Needs cli.py, which needs biomni --
        # no key, no network, no cluster: every provider call is a stub.
        run: python tests/test_onboarding.py
